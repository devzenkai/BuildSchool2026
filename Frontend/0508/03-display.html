<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .block-element{
            width: 200px;
            height: 200px;
            background-color: #fa0;
            display: block;
        }
        .inline-element{
            display: inline;
            width: 200px;
            height: 200px;
            background-color: #fa0;
            padding-left: 10px;
            padding-right: 10px;

            margin-right: 50px;
        }

        .inline-block{
            display: inline-block;
            width: 200px;
            height: 200px;
            margin: 10px;
            background-color: #f0a;
        }

        .flex-box{
            display: flex;
            width: 600px;
            background: #666;
        }

        .flex-item{
            background-color: #fa0;
            width: 300px;
            height: 200px;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <div class="block-element">123</div>
    <div class="inline-element">123</div>
    <div class="inline-block">123</div>
    <div class="inline-block">123</div>
    <div class="inline-block">123</div>

    <div class="flex-box">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
    </div>
</body>
</html>
