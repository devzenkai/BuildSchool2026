<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- bootstrap 5.3 css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- bootstrap icon 1.13.1 css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom css -->
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/header.css" />
  </head>
  <body>
    <!-- topbar -->
    <div class="bg-black text-white small py-2 text-center">
      <div
        class="container d-flex flex-column flex-md-row justify-content-md-between"
      >
        <p class="mb-1 mb-md-0">春季新品上市｜滿 NT$1,200 免運</p>
        <p class="mb-0">
          <i class="bi bi-truck me-1"></i> 24 小時快速出貨
          <span class="mx-1">|</span>
          <i class="bi bi-shield-check me-1"></i>七天鑑賞期
        </p>
      </div>
    </div>
    <!-- nav bar -->
    <nav class="navbar navbar-expand-lg bg-white">
      <div class="container py-2">
        <a class="navbar-brand fw-bold fs-3" href="#"
          >Urban<span class="text-brand">Cart</span></a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">首頁</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">商品分類</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">熱銷商品</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">限時優惠</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">顧客評價</a>
            </li>
          </ul>
          <!-- navbar button group -->
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-light rounded-circle">
              <i class="bi bi-search"></i>
            </button>
            <button type="button" class="btn btn-light rounded-circle">
              <i class="bi bi-person"></i>
            </button>
            <!-- shop cart -->
            <button
              type="button"
              class="btn btn-brand rounded-pill position-relative"
            >
              <i class="bi bi-cart-check me-2"></i>購物車
              <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              >
                3
              </span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- bootstrap 5.3 js -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
