<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        .card {
            width: 500px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            display: block;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 16px 8px;
        }

        .card-content {
            font-size: 14px;
            color: #666;
            padding: 0 16px 16px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-img">
            <img src="https://picsum.photos/500/300/?random=10" />
        </div>
        <div class="card-title">卡片標題</div>
        <div class="card-content">
            這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容
        </div>
    </div>
</body>

</html>
