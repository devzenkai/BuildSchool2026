<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .container {
        width: 100%;
        padding: 10px;
        background-color: #fa0;
      }

      @media print {
        .container {
          width: 500px;
          height: 500px;
          color: blue;
          font-size: 50px;

      @media screen and (min-width: 768px) {
        .container {
          background-color: #f0a;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">123</div>
  </body>
</html>
