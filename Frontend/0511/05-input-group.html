<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: auto;
        /* border: 1px solid red; */
      }
      .input-group {
        display: flex;
        margin: 15px 0;
      }
      .input-group input {
        /* flex: 1; */
        flex-grow: 1;
        outline: none;
        border: 1px solid #ced4da;
        border-right: none;
        padding: 10px 15px;
      }
      .input-group button {
        flex-shrink: 0;
        background-color: #007bff;
        color: white;
        border: 1px solid #007bff;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="input-group">
        <input type="text" placeholder="請輸入關鍵字" />
        <button>搜尋</button>
      </div>
      <div class="input-group">
        <input type="text" placeholder="請輸入電子郵件" />
        <button>搜尋</button>
      </div>
      <div class="input-group">
        <input type="text" placeholder="請輸入姓名" />
        <button>搜尋</button>
      </div>
    </div>
  </body>
</html>
