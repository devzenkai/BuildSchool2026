<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        /* gap: 10px; */
      }
      .col {
        width: 100%;
        height: 100px;
        background-color: orange;
        border: 1px solid red;
      }

      @media screen and (min-width: 768px) {
        .col {
          width: 50%;
        }
        .main-omg {
          width: 100%;
        }
      }
      @media screen and (mid-width: 992px) {
        .col {
          width: 33.33%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col">A</div>
        <div class="col">B</div>
        <div class="col">C</div>
      </div>
    </div>
  </body>
</html>
