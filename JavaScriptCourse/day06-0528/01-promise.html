<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /*
        Promise 狀態
          - pending (還沒成功, 等待中)
          - fulfilled (成功, 回傳結果)
          - rejected (失敗, 拋出錯誤)
        */

      const promise1 = new Promise((resolve, reject) => {
        // 成功
        resolve("promise1 resolve!");
      });

      const promise2 = new Promise((resolve, reject) => {
        // 失敗
        // reject("promise2 reject!");
        resolve("promise2 resolve!");
      });

      // console.log(promise1);
      // console.log(promise2);

      promise1
        .then((res) => {
          console.log(res);
        })
        .finally(() => {
          console.log("promise1 finally...");
        });

      promise2
        .then((res) => {
          console.log(res);
        })
        .catch((err) => {
          console.warn(err);
        })
        .finally(() => {
          console.log("promise2 finally...");
        });

      const getUser = new Promise((resolve, reject) => {
        resolve({
          id: 1,
          name: "Andy",
        });
      });

      getUser.then((res) => {
        console.log(res);
      });

      const getOrders = (userId) => {
        return new Promise((resolve, reject) => {
          if (userId === 0) {
            reject("user id 有問題");
          }
          const userOrders = {
            userId: userId,
            orders: ["order1", "order2", "order3"],
          };
          resolve(userOrders);
        });
      };

      //先取得 user, 再從 user 取訂單
      getUser.then((user) => {
        console.log(user);
        getOrders(user.id).then((res) => {
          console.log(res);
        });
      });

      //promise chain
      getUser
        .then((user) => {
          console.log(user);
          return getOrders(user.id);
        })
        .then((res) => {
          console.log(res);
        })
        .catch((err) => {
          console.warn(err);
        })
        .finally(() => {
          console.log("都處理完了！");
        });

      //async-await
      (async function () {
        // const user = await getUser;
        // console.log(user);
        // const orders = await getOrders(user.id)
        // console.log(orders);

        try {
          const user = await getUser;
          console.log(user);
          const orders = await getOrders(user.id);
          console.log(orders);
        } catch (err) {
          console.warn(err);
        } finally {
          console.log("都做完了");
        }
      })();
    </script>
  </body>
</html>
