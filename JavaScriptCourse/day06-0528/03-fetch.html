<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button class="btn-fetch-data">點我取得資料</button>
    <button class="btn-youbike-data">點我抓 youbike</button>
    <script>
      const url = "https://jsonplaceholder.typicode.com/posts/1";
      const youbikeDataurl =
        "https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json";
      const fetchDataBtn = document.querySelector(".btn-fetch-data");
      const fetchYouBikeBtn = document.querySelector(".btn-youbike-data");

      fetchDataBtn.addEventListener("click", () => {
        fetch(url)
          .then((response) => {
            //   console.log(response);
            if (!response.ok) {
              throw new Error(`請求失敗：status ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            console.log(data);
          })
          .catch((err) => {
            console.warn(err);
          });
      });

      //   // promise-based
      //   fetchYouBikeBtn.addEventListener("click", () => {
      //     fetch(youbikeDataurl)
      //       .then((response) => response.json())
      //       .then((body) => {
      //         console.log(body);
      //       });
      //   });

      fetchYouBikeBtn.addEventListener("click", async () => {
        try {
          const response = await fetch(youbikeDataurl);
          const body = await response.json();
          console.log(body);
        } catch (err) {}
      });
    </script>
  </body>
</html>
