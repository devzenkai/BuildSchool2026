<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Vue</title>
  </head>

  <body>
    <div id="app">
      <button @click="clickBtn">點我！</button>
      <p>點了：{{count}} 次</p>

      <section>
        <button @click="clickMinus">-</button>
        <span> {{quantity}} </span>
        <button @click="clickPlus">+</button>
      </section>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue;

      const app = createApp({
        data() {
          return {
            count: 0,
            quantity: 0,
          };
        },
        methods: {
          //   clickBtn: function () {
          //     this.count++;
          //   },
          clickBtn() {
            this.count++;
          },
          clickPlus() {
            this.quantity++;
          },
          clickMinus() {
            this.quantity--;
            if (this.quantity < 0) {
              this.quantity = 0;
            }
          },
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
