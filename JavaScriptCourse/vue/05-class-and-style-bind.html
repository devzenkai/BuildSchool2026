<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Vue</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div id="app">
      <div>姓名：{{person.name}}</div>
      <div>分數：{{person.score}}</div>
      <div>通過狀態：{{stateInfo}}</div>
      <button @click="add" :class="addBtnClassArr">+10</button>
      <button @click="minus" :class="minusBtnClassObj">-10</button>
      <button @click="reset" class="btn btn-danger" :class="resetBtnClassObj">
        reset
      </button>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue;

      const app = createApp({
        data() {
          return {
            person: {
              name: "Andy",
              score: 60,
            },
            count: 0,
            btnClass: "btn btn-primary",
            addBtnClassArr: ["btn", "btn-primary"],
            minusBtnClassObj: {
              btn: true,
              "btn-outline-primary": true,
            },
            // resetBtnClassObj: {
            //   disabled: true,
            // },
          };
        },
        methods: {
          add() {
            this.person.score += 10;
          },
          minus() {
            this.person.score -= 10;
          },
          reset() {
            this.person.score = 60;
          },
        },
        computed: {
          stateInfo() {
            console.log("stateInfo");

            return this.person.score >= 60 ? "及格" : "不及格";
          },
          resetBtnClassObj() {
            return {
              disabled: this.person.score === 60,
            };
          },
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
