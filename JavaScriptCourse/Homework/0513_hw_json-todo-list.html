<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="contianer">
      <h1 class="todo-title">我的待辦清單</h1>
      <div class="todo-container">
        <div class="input-group mb-3 todo-item">
          <div class="input-group-text">
            <input
              class="form-check-input mt-0"
              type="checkbox"
              value=""
              aria-label="Checkbox for following text input"
            />
          </div>
          <input
            type="text"
            class="form-control"
            placeholder="Default input"
            aria-label="Text input with checkbox"
          />
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      const myTodo = {
        title: "我的待辦清單",
        items: [
          {
            id: 1,
            content: "項目1",
            isDone: true,
          },
          {
            id: 2,
            content: "項目2",
            isDone: false,
          },
        ],
      };

      const title = document.querySelector(".todo-title");
      title.textContent = myTodo.title;

      const todoContainer = document.querySelector(".todo-container");

      for (let item of myTodo.items) {
        const todoItem = document.createElement("div");
        todoItem.classList.add("input-group", "mb-3", "todo-item");

        // <div class="input-group-text">
        //   <input
        //     class="form-check-input mt-0"
        //     type="checkbox"
        //     value=""
        //     aria-label="Checkbox for following text input"
        //   />
        // </div>
        const todoCheck = document.createElement("div");
        todoCheck.classList.add("input-group-text");
        const checkInput = document.createElement("input");
        checkInput.classList.add("form-check-input", "mt-0");
        checkInput.setAttribute("type", "checkbox");
        
        checkInput.checked = item.isDone;
        if(item.isDone){
          checkInput.setAttribute("checked", "true")
        }
        todoCheck.append(checkInput);

        // <input
        //   type="text"
        //   class="form-control"
        //   placeholder="Default input"
        //   aria-label="Text input with checkbox"
        // />
        const contentInput = document.createElement("input");
        contentInput.classList.add("form-control");
        contentInput.setAttribute("type", "text");
        contentInput.value = item.content;

        todoItem.append(todoCheck, contentInput);
        todoContainer.append(todoItem);
      }
    </script>
  </body>
</html>
