<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function isTruthy(value){
            if(value){
                console.log("Truthy!");
            }else{
                console.log("Falsy!");
            }
        }

        isTruthy(null);
        isTruthy(undefined);
        isTruthy(NaN);
        isTruthy(0);
        isTruthy("");

        isTruthy("hi");
        isTruthy(false);

    </script>
</body>
</html>
