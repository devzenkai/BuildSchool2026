<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .go {
        color: red;
      }

      .stop {
        color: blue;
      }
    </style>
  </head>
  <body>
    <div id="my-box">
      <h1>Hi~~</h1>
    </div>
    <button class="start-btn">start</button>
    <button class="stop-btn">stop</button>
    <script>
      //   console.log("A");
      //   setTimeout(() => {
      //     console.log("B");
      //   }, 1000);
      //   console.log("C");

      const myBox = document.querySelector("#my-box");
      const startBtn = document.querySelector(".start-btn");
      const stopBtn = document.querySelector(".stop-btn");

      function flashText() {
        if (myBox.classList.contains("go")) {
          myBox.classList.remove("go");
          myBox.classList.add("stop");
        } else {
          myBox.classList.remove("stop");
          myBox.classList.add("go");
        }
      }

      // window.setInterval...
      let intervalID;
      startBtn.addEventListener("click", () => {
        if (intervalID) {
          return;
        }
        intervalID = setInterval(() => {
          flashText();
        }, 1000 * 1);
      });

      stopBtn.addEventListener("click", () => {
        clearInterval(intervalID);
        intervalID = null;
      });

      //window.setTimeout
      //   setTimeout(() => {
      //     console.log("1s...");
      //   }, 1000 * 1);

      //   setTimeout(() => {
      //     console.log("2s...");
      //   }, 1000 * 2);

      //   setTimeout(() => {
      //     console.log("3s...");
      //   }, 1000 * 3);

      //   setTimeout(() => {
      //     console.log("4s...");
      //   }, 1000 * 4);

      //   setTimeout(() => {
      //     console.log("5s...");
      //   }, 1000 * 5);

      for (let i = 1; i < 6; i++) {
        setTimeout(() => {
          console.log(`${i}s...`);
        }, 1000 * i);
      }

      function countWithIIFE(times) {
        for (var i = 1; i < times; i++) {
          (function (x) {
            setTimeout(() => {
              console.log(`${x}s...`);
            }, 1000 * x);
          })(i);
        }
      }
      //   countWithIIFE(5);

      //callback hell
      setTimeout(() => {
        console.log(1);
        setTimeout(() => {
          console.log(2);
          setTimeout(() => {
            console.log(3);
          }, 1000);
        }, 1000);
      }, 1000);
    </script>
  </body>
</html>
