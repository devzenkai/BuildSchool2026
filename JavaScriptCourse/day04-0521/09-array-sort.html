    <script>
      const numArr = [3, 2, 1, 6, 8, 11];
      console.log("numArr 的內容");
      console.log(numArr);
      console.log("預設的排序方式：");
      numArr.sort();
      console.log(numArr);

      const arr = numArr.sort();
      console.log(arr);
      console.log(arr === numArr);

      console.log("數字小到大的排序");

      //   numArr.sort(orderByAsc);
      numArr.sort(orderByAsc);
      console.log(numArr);

      function orderByAsc(a, b) {
        if (a > b) {
          return 1;
        }
        if (a < b) {
          return -1;
        }
        return 0;
      }

      function orderByDesc(a, b) {
        if (a > b) {
          return -1;
        }
        if (a < b) {
          return 1;
        }
        return 0;
      }

      const people = [
        {
          name: "Bill",
          age: 47,
        },
        {
          name: "John",
          age: 37,
        },
        {
          name: "Tom",
          age: 48,
        },
        {
          name: "David",
          age: 36,
        },
        {
          name: "Bill",
          age: 35,
        },
      ];

      console.log("people 小到大排:");
      people.sort((a, b) => a.age - b.age);
      console.log(people);

      console.log("十二生肖排序(自訂排序)");
