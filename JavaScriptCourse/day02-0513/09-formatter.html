<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const courseDate = new Date("2026-05-07T10:00:00");
      //   const formatter = new Intl.DateTimeFormat("zh-TW", {
      //     dateStyle: "long",
      //     timeStyle: "short",
      //   });
      const formatter = new Intl.DateFormat("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short",
      });
      console.log(formatter.format(courseDate));

      const total = 1234567.89;
      const numFormatter = new Intl.NumberFormat("zh-TW");
      console.log(formatter.format(total));

      const priceFormatter = new Intl.NumberFormat("zh-TW", {
        style: "currency",
        currency: "TWD",
      });

      console.log(priceFormatter.format(total));
    </script>
  </body>
