    <script>
      const student = {
        id: 1,
        name: "Amy",
        score: 82,
        isActive: true,
      };

      console.log(student["score"]); //括號記法

      student.gender = "female";
      student.name = "Candy";

      delete student.score;
      console.dir(student);

      const cart = {
        items: [100, 200, 300],
        getTotal() {

      console.dir(cart);
      console.log(cart.getTotal());
