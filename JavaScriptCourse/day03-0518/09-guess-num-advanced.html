<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 150px;
      }
      .row {
        display: flex;
        flex-wrap: wrap-reverse;
      }

      .col {
        box-sizing: border-box;
        border: 1px solid red;
        width: 33.3333%;
        text-align: center;
        order: 1;
        border-radius: 10px;
        cursor: pointer;
      }
      .col:first-child {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <input type="text" class="guess-input" />
    <button class="guess-btn">猜！</button>
    <div class="answer">請輸入1~100之間的整數</div>
    <div class="container">
      <div class="row panel">
        <div class="col" data-num="0">零</div>
        <div class="col" data-num="1">一</div>
        <div class="col" data-num="2">二</div>
        <div class="col" data-num="3">三</div>
        <div class="col" data-num="4">四</div>
        <div class="col" data-num="5">五</div>
        <div class="col" data-num="6">六</div>
        <div class="col" data-num="7">七</div>
        <div class="col" data-num="8">八</div>
        <div class="col" data-num="9">九</div>
      </div>
    </div>
    <script>
      const guessInput = document.querySelector(".guess-input");
      const guessBtn = document.querySelector(".guess-btn");
      const answerDisplay = document.querySelector(".answer");
      const panel = document.querySelector(".panel");

      let answer;
      let min = 1;
      let max = 100;

      function getRandomIntInclusive(min, max) {
        const minCeiled = Math.ceil(min);
        const maxFloored = Math.floor(max);
        return Math.floor(
          Math.random() * (maxFloored - minCeiled + 1) + minCeiled,
        ); // The maximum is inclusive and the minimum is inclusive
      }

      function displayAnswer() {
        answerDisplay.textContent = `請輸入 ${min} ~ ${max} 之間的整數`;
      }

      //產出1~100之間的隨機整數
      answer = getRandomIntInclusive(min, max);

      displayAnswer();

      guessBtn.addEventListener("click", function () {
        let guessNum = guessInput.value;

        //判斷是不是數字
        if (isNaN(guessNum)) {
          alert("請輸入數字!");
          guessInput.value = "";
          return;
        }
        //轉成數字
        guessNum = parseInt(guessNum);

        if (guessNum === answer) {
          alert(`猜中了！答案是: ${answer}`);
          guessInput.value = "";
          return;
        }

        if (guessNum > max || guessNum < min) {
          alert("輸入有問題！");
          guessInput.value = "";
          return;
        }

        if (guessNum > answer) {
          max = guessNum;
        } else {
          min = guessNum;
        }

        displayAnswer();
        guessInput.value = "";
      });

      panel.addEventListener("click", function (e) {
        const numBtn = e.target;
        console.log(numBtn);
        // const theNum = numBtn.getAttribute("data-num");
        // dataset(data-)
        const theNum = numBtn.dataset.num;
        console.log(theNum);

        guessInput.value += theNum;
      });
    </script>
  </body>
</html>
